services:
  baseauth-redis:
    image: redis:7-alpine
    container_name: baseauth-redis
    volumes:
      - ./dockerdata/redis/data:/data
    networks:
      - baseauthnet
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(redis-cli info persistence | grep '^loading:0') && (redis-cli ping | grep PONG) || exit 1",
        ]
      start_period: 60s
      interval: 60s
    command: redis-server --appendonly yes

  baseauth-postgres:
    image: postgres:16-alpine
    container_name: baseauth-postgres
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./dockerdata/postgres/16/data:/var/lib/postgresql/data/pgdata
    networks:
      - baseauthnet
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 60s
      interval: 60s

  baseauth-django:
    build: ./src
    container_name: baseauth-django
    env_file:
      - .env
    expose:
      - 8000
    volumes:
      - ./src:/django
      - ./logs:/logs
    networks:
      - baseauthnet
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8200/health || exit 1"]
      start_period: 60s
      interval: 60s
    depends_on: &django_depends_on
      baseauth-postgres:
        condition: service_healthy
      baseauth-redis:
        condition: service_healthy

  baseauth-rq-worker-1:
    build: ./src
    image: baseauth-django
    container_name: baseauth-rq-worker-1
    env_file:
      - .env
    volumes_from:
      - baseauth-django
    networks:
      - baseauthnet
    restart: always
    depends_on: *django_depends_on
    command: python manage.py rqworker --with-scheduler default

  baseauth-rq-worker-2:
    build: ./src
    image: baseauth-django
    container_name: baseauth-rq-worker-2
    env_file:
      - .env
    volumes_from:
      - baseauth-django
    networks:
      - baseauthnet
    restart: always
    depends_on: *django_depends_on
    command: python manage.py rqworker default

  # baseauth-cron handles restarts of unhealthy containers and
  # log rotation in baseauth-django.
  # See ./docker/cron/crontab for details.
  baseauth-cron:
    image: paradoxon/alpine-cron-sentry
    container_name: baseauth-cron
    environment:
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/cron/crontab:/tmp/crontab
    network_mode: "none"
    restart: always

networks:
  baseauthnet:
